[package]
default-run = "scam-guard"
name = "fpl-cli"
version = "0.1.0"
description = "Scam Guard CLI — explainable fraud checks over the FPL detector suite"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "scam-guard"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
chrono = { workspace = true }
sha2 = "=0.10.9"
fpl-core = { path = "../fpl-core" }
serde_json = { workspace = true }
clap = { workspace = true }

[[bin]]
name = "scam-guard-snapshot"
path = "src/snapshot.rs"
