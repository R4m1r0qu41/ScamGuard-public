[workspace]
resolver = "2"
members = ["crates/fpl-core", "crates/fpl-cli"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
clap = { version = "4", features = ["derive"] }
jsonschema = { version = "0.56", default-features = false, features = ["idna"] }
